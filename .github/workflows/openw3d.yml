name: openw3d

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  job:
    name: ${{ matrix.name }} Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 38
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC x86
            os: windows-latest
            cmake-args: -GNinja -DCMAKE_BUILD_TYPE=Release
            shell: pwsh
            arch: x86
            options: "/W4;/WX;/wd4244;/wd4456"
          - name: MSVC x64
            os: windows-latest
            cmake-args: -GNinja -DCMAKE_BUILD_TYPE=Release
            shell: pwsh
            arch: x64
          - name: MSVC x64 BGFX
            os: windows-latest
            cmake-args: -GNinja -DCMAKE_BUILD_TYPE=Release -DENABLE_BGFX_BACKEND=ON
            shell: pwsh
            arch: x64
            init-submodules: true
            build-bgfx-win: true
            build-args: --target ww3d2 renegade
          - name: MinGW x86
            os: windows-latest
            cmake-args: -DW3D_BUILD_OPTION_FFMPEG=ON -GNinja -DCMAKE_BUILD_TYPE=Release
            build-args: --target combat combate renegade renegadeserver ww3d2e wwaudioe wwphyse
            msys2: true
            msys2-msystem: mingw32
            msys2-env: mingw-w64-i686
            shell: msys2 {0}
          - name: MinGW x64
            os: windows-latest
            cmake-args: -DW3D_BUILD_OPTION_FFMPEG=ON -GNinja -DCMAKE_BUILD_TYPE=Release
            build-args: --target combat combate renegade renegadeserver ww3d2e wwaudioe wwphyse
            msys2: true
            msys2-msystem: mingw64
            msys2-env: mingw-w64-x86_64
            shell: msys2 {0}
          - name: MinGW clang x64
            os: windows-latest
            cmake-args: -DW3D_BUILD_OPTION_FFMPEG=ON -GNinja -DCMAKE_BUILD_TYPE=Release
            build-args: --target combat combate renegade renegadeserver ww3d2e wwaudioe wwphyse
            msys2: true
            msys2-msystem: clang64
            msys2-env: mingw-w64-clang-x86_64
            shell: msys2 {0}
          - name: MinGW x64 SDL3
            os: windows-latest
            cmake-args: -DW3D_BUILD_OPTION_FFMPEG=ON -GNinja -DCMAKE_BUILD_TYPE=Release
            build-args: --target combat combate renegade renegadeserver ww3d2e wwaudioe wwphyse
            sdl3: true
            msys2: true
            msys2-msystem: mingw64
            msys2-env: mingw-w64-x86_64
            shell: msys2 {0}
          - name: Linux x64
            os: ubuntu-latest
            sdl3: true
            linux: true
            build-args: >
               --parallel
               --target
               scripts
               bandtest
               wwsaveload
               wwmath
               wwutil
               wwdebug
               wwbitpack
               wwtranslatedb
            shell: bash
          - name: Linux x64 BGFX
            os: ubuntu-latest
            sdl3: true
            linux: true
            linux-bgfx: true
            init-submodules: true
            build-bgfx: true
            cmake-args: -DENABLE_BGFX_BACKEND=ON -DCMAKE_BUILD_TYPE=Release
            build-args: >-
               --parallel
               --target
               scripts
               bandtest
               wwsaveload
               wwmath
               wwutil
               wwdebug
               wwbitpack
               wwtranslatedb
               ww3d2
               ww3d2e
               renegade
            shell: bash

    steps:

    - uses: actions/checkout@v6
    - name: 'Set up MSYS2'
      if: ${{ !!matrix.msys2 }}
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msys2-msystem }}
        install: >-
          ${{ matrix.msys2-env }}-cc
          ${{ matrix.msys2-env }}-cmake
          ${{ matrix.msys2-env }}-ffmpeg
          ${{ matrix.msys2-env }}-ninja
          ${{ matrix.msys2-env }}-pkg-config
    - name: 'Set up MSVC dev cmd'
      if: ${{ !matrix.msys2 }}
      uses: ilammy/msvc-dev-cmd@v1.13.0
      with:
        arch: ${{ matrix.arch }}
    - uses: libsdl-org/setup-sdl@main
      if: ${{ !!matrix.sdl3 }}
      id: sdl
      with:
        install-linux-dependencies: true
        version: 3-latest
        cmake-generator: Ninja
        shell: ${{ matrix.shell }}
    - name: 'Set up DXVK for Linux'
      if: ${{ !!matrix.linux }}
      run: |
        sudo apt update -qq > /dev/null
        sudo apt install -qq libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libopenal-dev > /dev/null
        if [ -n "${{ matrix.linux-bgfx }}" ]; then
          sudo apt install -qq libvulkan-dev libgl-dev libx11-dev libxrandr-dev libxcursor-dev > /dev/null
        fi
        wget --no-verbose \
          -O /tmp/dxvk-native.tar.gz \
          "https://github.com/doitsujin/dxvk/releases/download/v2.7.1/dxvk-native-2.7.1-steamrt-sniper.tar.gz"

        sudo tar -xvf /tmp/dxvk-native.tar.gz -C /
    - name: 'Init submodules'
      if: ${{ !!matrix.init-submodules }}
      run: git submodule update --init --recursive
    - name: 'Build bgfx (Linux)'
      if: ${{ !!matrix.build-bgfx }}
      run: |
        cd external/bgfx && make linux-gcc-release64
      timeout-minutes: 10
    - name: 'Build bgfx (Windows MSVC)'
      if: ${{ !!matrix.build-bgfx-win }}
      shell: pwsh
      run: |
        cd external/bgfx
        ..\bx\tools\bin\windows\genie.exe vs2022
        msbuild .build\projects\vs2022\bgfx.sln /p:Configuration=Release /p:Platform=x64 /m
      timeout-minutes: 15
    - name: 'CMake (configure)'
      env:
        W3D_COMPILER_FLAGS:  ${{ matrix.options }}
      run: |
        cmake -S . -B build ${{ matrix.cmake-args }}
    - name: 'CMake (build)'
      run: |
        cmake --build build --parallel ${{ matrix.build-args }}
